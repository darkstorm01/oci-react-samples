apiVersion: database.oracle.com/v1alpha1
kind: AutonomousDatabase
metadata:
  name: cloudbankdb
  namespace: cloudbank
spec:
  action: Update
  details:
    id: %ADB_OCID%
    accessControlList:
    - 0.0.0.0/0
  ociConfig:
    configMapName: oci-cred
    secretName: oci-privatekey

---
apiVersion: database.oracle.com/v1alpha1
kind: AutonomousDatabase
metadata:
  name: cloudbankdb
  namespace: cloudbank
spec:
  action: Update
  details:
    id: %ADB_OCID%
    isMTLSConnectionRequired: false
  ociConfig:
    configMapName: oci-cred
    secretName: oci-privatekey