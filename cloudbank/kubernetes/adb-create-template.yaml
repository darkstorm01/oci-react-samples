apiVersion: database.oracle.com/v1alpha1
kind: AutonomousDatabase
metadata:
  name: cloudbankdb
  namespace: cloudbank
spec:
  action: Create
  details:
    compartmentId: %ADB_COMPARTMENT%
    dbName: %ADB_NAME%
    displayName: %ADB_DISPLAY_NAME%
    computeModel: ECPU
    computeCount: 1
    adminPassword:
      k8sSecret:
        name: admin-password

    dataStorageSizeInTBs: 1
  ociConfig:
    configMapName: oci-cred
    secretName: oci-privatekey