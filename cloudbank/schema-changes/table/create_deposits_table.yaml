databaseChangeLog:
  - changeSet:
      id: create-deposits-table
      author: bankauser-dev
      changes:
        - createTable:
            tableName: DEPOSITS
            columns:
              - column:
                  name: DEPOSTID
                  type: NUMBER
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ACCOUNTID
                  type: NUMBER
                  constraints:
                    nullable: false
              - column:
                  name: AMOUNT
                  type: NUMBER(10,2)
              - column:
                  name: DEPOSIT_DATE
                  type: DATE
                  defaultValueComputed: SYSDATE
              - column:
                  name: DEPOSIT_TYPE
                  type: VARCHAR2(50)
        - addForeignKeyConstraint:
            baseTableName: DEPOSITS
            baseColumnNames: ACCOUNTID
            constraintName: fk_account_id
            referencedTableName: ACCOUNTS
            referencedColumnNames: ACCOUNTID
      rollback:
        - dropTable:
            tableName: DEPOSITS
