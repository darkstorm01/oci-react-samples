databaseChangeLog:
  - changeSet:
      id: insert-deposits-data
      author: bankauser-dev
      changes:
        - insert:
            tableName: DEPOSITS
            columns:
              - column:
                  name: DEPOSTID
                  valueNumeric: 100
              - column:
                  name: ACCOUNTID
                  valueNumeric: 100
              - column:
                  name: AMOUNT
                  valueNumeric: 1000
              - column:
                  name: DEPOSIT_TYPE
                  value: FD
        - insert:
            tableName: DEPOSITS
            columns:
              - column:
                  name: DEPOSTID
                  valueNumeric: 200
              - column:
                  name: ACCOUNTID
                  valueNumeric: 100
              - column:
                  name: AMOUNT
                  valueNumeric: 10000
              - column:
                  name: DEPOSIT_TYPE
                  value: RD
        - insert:
            tableName: DEPOSITS
            columns:
              - column:
                  name: DEPOSTID
                  valueNumeric: 300
              - column:
                  name: ACCOUNTID
                  valueNumeric: 200
              - column:
                  name: AMOUNT
                  valueNumeric: 100000
              - column:
                  name: DEPOSIT_TYPE
                  value: FD
      rollback: |
        DELETE FROM DEPOSITS WHERE DEPOSTID IN (100, 200, 300);